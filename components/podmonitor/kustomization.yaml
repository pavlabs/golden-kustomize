# Needs the Prometheus Operator CRDs from the observability stack. Scrapes the `http` port's /metrics.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - podmonitor.yaml
replacements:
  - source:
      kind: ConfigMap
      name: golden
      fieldPath: data.name
    targets:
      - select:
          kind: PodMonitor
          name: golden
        fieldPaths:
          - metadata.name
          - spec.selector.matchLabels.[app.kubernetes.io/instance]
