apiVersion: batch/v1
kind: Job
metadata:
  name: golden-migrate
  annotations:
    # A Sync hook in wave -1 runs after the wave -2 ExternalSecret exists and before the workload rolls.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    # Failed runs stay for debugging until the next sync replaces them.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: golden
    spec:
      restartPolicy: Never
      # Runs as the namespace's default ServiceAccount, which would otherwise mount a token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: app
          command: ["false"]
          # The externalsecret component's Secret, when the app uses it; optional so the Job also runs without one.
          envFrom:
            - secretRef:
                name: golden
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
