# About 100000 monthly recurring users. At this scale replicas buy availability, not throughput.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
components:
  - ../hpa
patches:
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 12
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 2Gi
