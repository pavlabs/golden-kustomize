apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: golden
spec:
  # No sectionName: the gateway picks the listener whose domain matches the host and admits the route's namespace.
  parentRefs:
    - name: platform
      namespace: gateway
  hostnames:
    - golden.invalid
  rules:
    - backendRefs:
        - name: golden
          port: 80
