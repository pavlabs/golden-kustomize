apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden
  labels:
    app.kubernetes.io/name: golden
    app.kubernetes.io/instance: golden
spec:
  # No replicas: the HPA from a size component owns the count, and a value here would fight it on every sync.
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    # Every rollout adds capacity before taking any away.
    rollingUpdate:
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/instance: golden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golden
        app.kubernetes.io/instance: golden
    spec:
      serviceAccountName: golden
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Set with the kustomization's `images:` field, pinned to a version or digest.
          image: app
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # A read-only root filesystem needs somewhere writable, and /tmp is nearly always it.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
