# The one component every golden workload uses: a Deployment and its ServiceAccount, named from the
# app's `golden` config. Every other component builds on it, so list it first.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - serviceaccount.yaml
  - deployment.yaml
replacements:
  - source:
      kind: ConfigMap
      name: golden
      fieldPath: data.name
    targets:
      - select:
          kind: ServiceAccount
          name: golden
        fieldPaths:
          - metadata.name
      - select:
          kind: Deployment
          name: golden
        fieldPaths:
          - metadata.name
          - metadata.labels.[app.kubernetes.io/name]
          - metadata.labels.[app.kubernetes.io/instance]
          - spec.selector.matchLabels.[app.kubernetes.io/instance]
          - spec.template.metadata.labels.[app.kubernetes.io/name]
          - spec.template.metadata.labels.[app.kubernetes.io/instance]
          - spec.template.spec.serviceAccountName
