apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - service.yaml
replacements:
  - source:
      kind: ConfigMap
      name: golden
      fieldPath: data.name
    targets:
      - select:
          kind: Service
          name: golden
        fieldPaths:
          - metadata.name
          - metadata.labels.[app.kubernetes.io/instance]
          - spec.selector.[app.kubernetes.io/instance]
