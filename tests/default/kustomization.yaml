apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
resources:
  - golden.yaml
components:
  - ../../base
images:
  - name: app
    newName: ghcr.io/pavlabs/web
    newTag: 2.0.0
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: golden
