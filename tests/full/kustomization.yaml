apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
resources:
  - golden.yaml
components:
  - ../../base
  - ../../components/externalsecret
  - ../../components/migration-job
  - ../../components/servicemonitor
  - ../../components/size/10000
  - ../../components/ceiling/100000
  - ../../components/tier/enterprise
images:
  - name: app
    newName: ghcr.io/pavlabs/api
    newTag: 1.2.3
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/part-of: shop
      app.kubernetes.io/component: api
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: golden
